<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇 Pro · 倍速版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --green:#7ee0a0; --gold:#ffd166; --red:#ff5d73; --blue:#5db8ff; --purple:#c08bff; }
  body {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 0%, #1b2233, #0a0d14 70%);
    font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif; color:#e6e6e6;
    user-select:none; -webkit-tap-highlight-color:transparent; padding:14px; gap:10px;
  }
  h1 { font-size:20px; letter-spacing:4px; font-weight:700; color:var(--green); text-shadow:0 0 18px rgba(126,224,160,.45); }

  .hud { width:100%; max-width:560px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; font-size:14px; }
  .hud .item { color:#9aa6bd; }
  .hud .item b { color:var(--green); font-weight:700; }
  .hud .item.best b { color:var(--gold); }

  .toolbar { width:100%; max-width:560px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

  .seg { display:flex; background:#151b26; border:1px solid #262f42; border-radius:10px; overflow:hidden; }
  .seg button {
    border:none; background:transparent; color:#8d9bb5; padding:7px 13px;
    font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .seg button:hover { color:#cfd9ec; background:#1d2534; }
  .seg button.active { background:linear-gradient(135deg,#2c8d5b,#1f6d45); color:#eafff3; box-shadow:inset 0 0 0 1px #3fae74; }

  .toggle {
    display:flex; align-items:center; gap:7px; padding:7px 13px;
    background:#151b26; border:1px solid #262f42; border-radius:10px;
    font-size:13px; font-weight:600; color:#8d9bb5; cursor:pointer;
    transition:all .15s; white-space:nowrap;
  }
  .toggle:hover { color:#cfd9ec; }
  .toggle.on { color:#eafff3; background:linear-gradient(135deg,#2c8d5b,#1f6d45); border-color:#3fae74; }
  .toggle .dot { width:8px; height:8px; border-radius:50%; background:#46536b; transition:all .15s; }
  .toggle.on .dot { background:#b8ffd6; box-shadow:0 0 8px #7ee0a0; }

  /* 倍速按钮组高亮成紫色 */
  #speedSeg button.active { background:linear-gradient(135deg,#7e4fd6,#5a35a8); box-shadow:inset 0 0 0 1px #a97df0; }
  #speedSeg button.active[data-mult="5"],
  #speedSeg button.active[data-mult="10"] { background:linear-gradient(135deg,#d64f8c,#a83566); box-shadow:inset 0 0 0 1px #f07db8; }

  .stage {
    position:relative; border-radius:14px; overflow:hidden;
    box-shadow:0 0 0 1px #2b3448, 0 18px 50px rgba(0,0,0,.6), 0 0 60px rgba(126,224,160,.08);
  }
  canvas { display:block; background:#12161f; touch-action:none; }

  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(8,11,17,.86); backdrop-filter:blur(5px); text-align:center; padding:22px;
    transition:opacity .25s; z-index:5;
  }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .overlay .title { font-size:28px; font-weight:800; letter-spacing:2px; color:var(--red); text-shadow:0 0 22px rgba(255,93,115,.5); }
  .overlay .title.win { color:var(--green); text-shadow:0 0 22px rgba(126,224,160,.5); }
  .overlay .sub { font-size:13.5px; color:#9aa6bd; line-height:1.9; max-width:400px; }
  .overlay .sub b { color:var(--green); }

  kbd {
    display:inline-block; padding:2px 7px; border-radius:5px; background:#232b3d;
    border:1px solid #3a455e; font-size:12px; color:#cdd6ea; font-family:inherit;
  }
  .btn {
    padding:10px 28px; border:none; border-radius:999px; font-size:15px; font-weight:700;
    letter-spacing:1px; color:#08110c; background:linear-gradient(135deg,#7ee0a0,#4fc07d);
    cursor:pointer; box-shadow:0 8px 24px rgba(126,224,160,.28); transition:transform .12s, box-shadow .12s;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(126,224,160,.4); }
  .btn:active { transform:translateY(0) scale(.97); }

  .dpad { display:none; margin-top:4px; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,58px); gap:7px; }
  .dpad button {
    border:1px solid #2f3a52; background:#1a2130; color:#9fb0cc; border-radius:14px;
    font-size:20px; cursor:pointer; transition:background .12s;
  }
  .dpad button:active { background:#263149; color:var(--green); }
  .dpad .spacer { visibility:hidden; }
  @media (hover:none) and (pointer:coarse) { .dpad { display:grid; } h1 { font-size:18px; } }

  .legend { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; font-size:11.5px; color:#61708c; max-width:560px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
</style>
</head>
<body>

<h1>贪 吃 蛇 P R O</h1>

<div class="hud">
  <div class="item">得分：<b id="score">0</b></div>
  <div class="item best">最高分：<b id="best">0</b></div>
  <div class="item">长度：<b id="len">3</b></div>
  <div class="item">倍速：<b id="mult">1×</b></div>
  <div class="item" id="stateLabel">准备中</div>
</div>

<div class="toolbar">
  <div class="seg" id="diffSeg">
    <button data-diff="easy">🐢 简单</button>
    <button data-diff="normal" class="active">🎯 普通</button>
    <button data-diff="hard">🔥 困难</button>
    <button data-diff="insane">💀 地狱</button>
  </div>

  <div class="seg" id="speedSeg">
    <button data-mult="1" class="active">1×</button>
    <button data-mult="2">2×</button>
    <button data-mult="3">3×</button>
    <button data-mult="5">5×</button>
    <button data-mult="10">10×</button>
  </div>

  <div class="toggle" id="wallToggle"><span class="dot"></span> 🧱 障碍</div>
  <div class="toggle on" id="soundToggle"><span class="dot"></span> 🔊 音效</div>
  <div class="toggle" id="aiToggle"><span class="dot"></span> 🤖 AI</div>
</div>

<div class="stage">
  <canvas id="game"></canvas>
  <div class="overlay" id="overlay">
    <div class="title" id="ovTitle">准备开始</div>
    <div class="sub" id="ovSub"></div>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>

<div class="dpad">
  <div class="spacer"></div>
  <button data-dir="up">▲</button>
  <div class="spacer"></div>
  <button data-dir="left">◀</button>
  <div class="spacer"></div>
  <button data-dir="right">▶</button>
  <div class="spacer"></div>
  <button data-dir="down">▼</button>
  <div class="spacer"></div>
</div>

<div class="legend">
  <span><i style="background:#ff5d73"></i>普通 +10</span>
  <span><i style="background:#ffd166"></i>双倍 ×2</span>
  <span><i style="background:#5db8ff"></i>减速</span>
  <span><i style="background:#c08bff"></i>加速</span>
  <span><i style="background:#8a93a8"></i>石头（撞上就死）</span>
</div>

<script>
(() => {
  'use strict';

  const COLS = 24, ROWS = 24, CELL = 20;
  const W = COLS * CELL, H = ROWS * CELL;

  const DIFF = {
    easy:   { name:'简单', speed:6,  max:13, foodCount:2, stoneCount:0  },
    normal: { name:'普通', speed:8,  max:20, foodCount:2, stoneCount:0  },
    hard:   { name:'困难', speed:11, max:26, foodCount:3, stoneCount:8  },
    insane: { name:'地狱', speed:15, max:34, foodCount:4, stoneCount:16 },
  };

  const FOOD_TYPES = {
    normal: { color:'#ff5d73', glow:'rgba(255,93,115,.55)', score:10, weight:60, label:'+10' },
    double: { color:'#ffd166', glow:'rgba(255,209,102,.6)',  score:20, weight:18, label:'×2' },
    slow:   { color:'#5db8ff', glow:'rgba(93,184,255,.6)',   score:5,  weight:12, label:'慢' },
    fast:   { color:'#c08bff', glow:'rgba(192,139,255,.6)',  score:15, weight:10, label:'快' },
  };
  const FOOD_KEYS = Object.keys(FOOD_TYPES);
  const TOTAL_WEIGHT = FOOD_KEYS.reduce((s,k) => s + FOOD_TYPES[k].weight, 0);

  const COLOR = { bg:'#12161f', grid:'#1a1f2b', head:'#8df0b0', headGlow:'rgba(126,224,160,.55)',
                  body:'#4fc07d', bodyAlt:'#43a86c', stone:'#3a4358', stoneHi:'#59637c' };

  const DIR = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
  const DIR_LIST = ['up','down','left','right'];
  const STATE = { READY:'ready', RUNNING:'running', PAUSED:'paused', OVER:'over' };

  const canvas   = document.getElementById('game');
  const ctx      = canvas.getContext('2d');
  const scoreEl  = document.getElementById('score');
  const bestEl   = document.getElementById('best');
  const lenEl    = document.getElementById('len');
  const multEl   = document.getElementById('mult');
  const stateEl  = document.getElementById('stateLabel');
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ovTitle');
  const ovSub    = document.getElementById('ovSub');
  const ovBtn    = document.getElementById('ovBtn');

  const diffSeg     = document.getElementById('diffSeg');
  const speedSeg    = document.getElementById('speedSeg');
  const wallToggle  = document.getElementById('wallToggle');
  const soundToggle = document.getElementById('soundToggle');
  const aiToggle    = document.getElementById('aiToggle');

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  ctx.scale(DPR, DPR);

  function fitCanvas() {
    const maxW = Math.min(window.innerWidth - 24, 560);
    const s = Math.min(1, maxW / W);
    canvas.style.width  = W * s + 'px';
    canvas.style.height = H * s + 'px';
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  /* ============ 音效 ============ */
  const Sound = (() => {
    let ctxA = null, enabled = true;
    function ensure() {
      if (!ctxA) { try { ctxA = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ enabled=false; } }
      if (ctxA && ctxA.state === 'suspended') ctxA.resume();
      return ctxA;
    }
    function tone(freq, dur, type='square', vol=0.12, slideTo=null, delay=0) {
      if (!enabled) return;
      const ac = ensure(); if (!ac) return;
      const t0 = ac.currentTime + delay;
      const osc = ac.createOscillator(), gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0+0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      osc.connect(gain).connect(ac.destination);
      osc.start(t0); osc.stop(t0+dur+0.02);
    }
    function noise(dur, vol=0.1, delay=0) {
      if (!enabled) return;
      const ac = ensure(); if (!ac) return;
      const t0 = ac.currentTime + delay;
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
      const src = ac.createBufferSource(); src.buffer = buf;
      const gain = ac.createGain();
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      src.connect(gain).connect(ac.destination); src.start(t0);
    }
    return {
      setEnabled(v){ enabled=v; if(v) ensure(); },
      isEnabled(){ return enabled; },
      resume(){ ensure(); },
      eat(){ tone(660,0.08,'square',0.13); tone(990,0.09,'square',0.10,null,0.05); },
      double(){ tone(784,0.09,'triangle',0.15); tone(1046,0.09,'triangle',0.13,null,0.07); tone(1318,0.12,'triangle',0.11,null,0.14); },
      slow(){ tone(520,0.16,'sine',0.16,300); },
      fast(){ tone(400,0.14,'sawtooth',0.11,900); },
      turn(){ tone(300,0.03,'square',0.04); },
      pause(){ tone(440,0.09,'sine',0.1); tone(330,0.11,'sine',0.09,null,0.08); },
      resumeS(){ tone(330,0.08,'sine',0.1); tone(494,0.1,'sine',0.1,null,0.07); },
      over(){ tone(400,0.16,'sawtooth',0.14,220); tone(300,0.18,'sawtooth',0.13,160,0.14); tone(200,0.4,'sawtooth',0.12,80,0.30); noise(0.5,0.07,0.30); },
      win(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.18,'triangle',0.14,null,i*0.1)); },
      start(){ [392,523,659].forEach((f,i)=>tone(f,0.12,'triangle',0.12,null,i*0.07)); },
      speedChange(mult) {
        // 倍速提示音：倍速越高音调越高
        const base = 440;
        tone(base + mult*60, 0.08, 'sine', 0.1);
        if (mult >= 5) tone(base + mult*60 + 220, 0.1, 'sine', 0.09, null, 0.06);
      }
    };
  })();

  /* ============ 状态 ============ */
  let state;
  let snake, dir, nextDir, foods, stones, particles, floats;
  let score, speed, baseSpeed, maxSpeed, acc, lastTime;
  let difficulty = 'normal';
  let wallMode = false;
  let aiMode = false;
  let speedMult = 1;

  let best = Number(localStorage.getItem('snake_pro_best') || 0);
  bestEl.textContent = best;

  function reset() {
    const cfg = DIFF[difficulty];
    baseSpeed = cfg.speed; maxSpeed = cfg.max; speed = cfg.speed;
    score = 0; acc = 0; lastTime = 0;
    particles = []; floats = [];
    const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
    snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
    dir = DIR.right; nextDir = DIR.right;
    stones = wallMode ? generateStones(cfg.stoneCount) : [];
    foods = [];
    for (let i=0;i<cfg.foodCount;i++){ const f = spawnFood(); if (f) foods.push(f); }
    scoreEl.textContent = '0';
    lenEl.textContent = snake.length;
  }

  function occupiedSet(extra) {
    const s = new Set();
    snake.forEach(p => s.add(p.x+','+p.y));
    stones.forEach(p => s.add(p.x+','+p.y));
    foods.forEach(p => s.add(p.x+','+p.y));
    if (extra) s.add(extra.x+','+extra.y);
    return s;
  }

  function generateStones(count) {
    if (count <= 0) return [];
    const result = [];
    const used = new Set(snake.map(p => p.x+','+p.y));
    const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
    const safe = (x,y) => Math.abs(x-cx) <= 2 && Math.abs(y-cy) <= 2;
    let guard = 0;
    while (result.length < count && guard++ < 3000) {
      const x = 2 + Math.floor(Math.random()*(COLS-4));
      const y = 2 + Math.floor(Math.random()*(ROWS-4));
      if (safe(x,y)) continue;
      const key = x+','+y;
      if (used.has(key)) continue;
      used.add(key); result.push({x,y});
    }
    return result;
  }

  function randomFoodType() {
    let r = Math.random() * TOTAL_WEIGHT;
    for (const k of FOOD_KEYS) { r -= FOOD_TYPES[k].weight; if (r <= 0) return k; }
    return 'normal';
  }

  function spawnFood(exclude) {
    const occ = occupiedSet(exclude);
    const empty = [];
    for (let x=0;x<COLS;x++) for (let y=0;y<ROWS;y++)
      if (!occ.has(x+','+y)) empty.push({x,y});
    if (!empty.length) return null;
    const p = empty[Math.floor(Math.random()*empty.length)];
    return { x:p.x, y:p.y, type:randomFoodType(), born:performance.now() };
  }

  function refillFoods() {
    const cfg = DIFF[difficulty];
    while (foods.length < cfg.foodCount) {
      const f = spawnFood(); if (!f) break; foods.push(f);
    }
  }

  /* ============ 输入 ============ */
  function setDir(name) {
    const d = DIR[name]; if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    if (d.x === -nextDir.x && d.y === -nextDir.y) return;
    nextDir = d; Sound.turn();
    if (state === STATE.READY) start();
  }

  const KEYMAP = {
    ArrowUp:'up', w:'up', W:'up', ArrowDown:'down', s:'down', S:'down',
    ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right',
  };

  window.addEventListener('keydown', e => {
    if (KEYMAP[e.key]) { e.preventDefault(); if (state===STATE.RUNNING||state===STATE.READY) setDir(KEYMAP[e.key]); return; }
    if (e.code === 'Space') {
      e.preventDefault();
      if (state===STATE.READY||state===STATE.OVER) start();
      else if (state===STATE.RUNNING) pause();
      else if (state===STATE.PAUSED) resume();
      return;
    }
    if (e.key === 'r' || e.key === 'R') { start(); return; }
    if (e.key === 'm' || e.key === 'M') { toggleSound(); return; }
    if (e.key === 'i' || e.key === 'I') { toggleAI(); return; }

    // 数字键 1/2/3/4/5 切换倍速（4 映射到 5）
    if (['1','2','3','4','5'].includes(e.key)) {
      const map = { '1':1, '2':2, '3':3, '4':5, '5':10 };
      setSpeedMult(map[e.key]);
    }
  });

  document.querySelectorAll('.dpad button[data-dir]').forEach(btn => {
    const fire = e => { e.preventDefault(); if (state===STATE.RUNNING||state===STATE.READY) setDir(btn.dataset.dir); };
    btn.addEventListener('touchstart', fire, {passive:false});
    btn.addEventListener('mousedown', fire);
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => { const t=e.changedTouches[0]; touchStart={x:t.clientX,y:t.clientY}; }, {passive:true});
  canvas.addEventListener('touchmove', e => {
    if (!touchStart || aiMode) return;
    const t = e.changedTouches[0];
    const dx = t.clientX-touchStart.x, dy = t.clientY-touchStart.y;
    if (Math.abs(dx)<24 && Math.abs(dy)<24) return;
    if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?'right':'left'); else setDir(dy>0?'down':'up');
    touchStart = null;
  }, {passive:true});
  canvas.addEventListener('touchend', () => { touchStart = null; }, {passive:true});

  ovBtn.addEventListener('click', () => {
    Sound.resume();
    if (state === STATE.PAUSED) resume(); else start();
  });

  /* ============ 状态切换 ============ */
  function start() {
    reset();
    state = STATE.RUNNING;
    hideOverlay();
    lastTime = performance.now();
    stateEl.textContent = '进行中';
    Sound.start();
  }
  function pause() {
    if (state !== STATE.RUNNING) return;
    state = STATE.PAUSED; stateEl.textContent = '已暂停';
    Sound.pause();
    showOverlay('已暂停', '按 <kbd>空格</kbd> 或点击按钮继续', '继续游戏');
  }
  function resume() {
    if (state !== STATE.PAUSED) return;
    state = STATE.RUNNING; stateEl.textContent = '进行中';
    hideOverlay(); lastTime = performance.now(); Sound.resumeS();
  }
  function gameOver(reason) {
    state = STATE.OVER; stateEl.textContent = '已结束';
    Sound.over();
    if (score > best) { best = score; localStorage.setItem('snake_pro_best', best); bestEl.textContent = best; }
    showOverlay('游戏结束', `${reason}<br>得分 <b>${score}</b> &nbsp;·&nbsp; 最高分 <b style="color:#ffd166">${best}</b><br>按 <kbd>R</kbd> 或点击按钮重来`, '再来一局');
  }
  function win() {
    state = STATE.OVER; stateEl.textContent = '通关';
    Sound.win();
    if (score > best) { best = score; localStorage.setItem('snake_pro_best', best); bestEl.textContent = best; }
    showOverlay('通关啦！', `你把整个棋盘填满了 🎉 得分 <b>${score}</b>`, '再玩一次', true);
  }
  function showOverlay(title, sub, btn, isWin) {
    ovTitle.textContent = title;
    ovTitle.className = 'title' + (isWin ? ' win' : '');
    ovSub.innerHTML = sub; ovBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  /* ============ 核心步进 ============ */
  function step() {
    if (aiMode) aiDecide();
    dir = nextDir;
    const head = snake[0];
    const nx = head.x + dir.x, ny = head.y + dir.y;
    let rx = nx, ry = ny;
    if (nx<0 || nx>=COLS || ny<0 || ny>=ROWS) {
      if (wallMode) return gameOver('💥 撞墙了');
      rx = (nx+COLS)%COLS; ry = (ny+ROWS)%ROWS;
    }
    for (const s of stones) if (s.x===rx && s.y===ry) return gameOver('🪨 撞上石头了');
    let eatenIdx = -1;
    for (let i=0;i<foods.length;i++) if (foods[i].x===rx && foods[i].y===ry) { eatenIdx=i; break; }
    const willEat = eatenIdx >= 0;
    const limit = willEat ? snake.length : snake.length-1;
    for (let i=0;i<limit;i++) if (snake[i].x===rx && snake[i].y===ry) return gameOver('🌀 咬到自己了');

    snake.unshift({x:rx, y:ry});

    if (willEat) {
      const f = foods[eatenIdx], def = FOOD_TYPES[f.type];
      score += def.score;
      scoreEl.textContent = score; lenEl.textContent = snake.length;
      burst(f.x, f.y, def.color); addFloat(f.x, f.y, def.label, def.color);
      if (f.type==='double') Sound.double();
      else if (f.type==='slow') Sound.slow();
      else if (f.type==='fast') Sound.fast();
      else Sound.eat();

      if (f.type==='slow') speed = Math.max(4, speed-3);
      else if (f.type==='fast') speed = Math.min(maxSpeed+6, speed+3);
      else { const lvl = Math.floor(score/60); speed = Math.min(maxSpeed, baseSpeed + lvl*1.4); }

      foods.splice(eatenIdx,1);
      refillFoods();
      if (foods.length===0 && snake.length >= COLS*ROWS - stones.length) return win();
    } else {
      snake.pop();
    }
    lenEl.textContent = snake.length;
  }

  function burst(gx, gy, color) {
    const cx = gx*CELL + CELL/2, cy = gy*CELL + CELL/2;
    for (let i=0;i<16;i++){
      const a = Math.random()*Math.PI*2, sp = 40+Math.random()*130;
      particles.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                       life:0.35+Math.random()*0.35, max:0.7, r:1.5+Math.random()*2.2, color });
    }
  }
  function addFloat(gx, gy, text, color) {
    floats.push({ x:gx*CELL+CELL/2, y:gy*CELL+CELL/2, text, color, life:0.9, max:0.9 });
  }

  function update(dt) {
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 60*dt; p.life -= dt;
      if (p.life<=0) particles.splice(i,1);
    }
    for (let i=floats.length-1;i>=0;i--){
      const f = floats[i]; f.y -= 32*dt; f.life -= dt;
      if (f.life<=0) floats.splice(i,1);
    }

    if (state !== STATE.RUNNING) return;

    // ★ 倍速核心：累积量乘上倍速，一帧可走多步
    acc += dt * speedMult;
    const interval = 1 / speed;
    const maxSteps = Math.max(5, 5 * speedMult);
    let guard = 0;
    while (acc >= interval && state === STATE.RUNNING && guard++ < maxSteps) {
      acc -= interval;
      step();
    }
    if (acc > interval * maxSteps) acc = 0;    // 防止累积爆表
  }

  /* ============ AI ============ */
  function aiDecide() {
    const head = snake[0];
    const candidates = DIR_LIST.map(n => ({name:n, ...DIR[n]}))
      .filter(d => !(d.x === -dir.x && d.y === -dir.y));

    let target = null, bestDist = Infinity;
    for (const f of foods) { const d = bfsDist(head, f); if (d>=0 && d<bestDist) { bestDist=d; target=f; } }
    if (!target) target = foods[0];
    if (!target) return;

    let bestDir = null, bestScore = -Infinity;
    for (const d of candidates) {
      let nx = head.x + d.x, ny = head.y + d.y;
      if (nx<0||nx>=COLS||ny<0||ny>=ROWS) {
        if (wallMode) continue;
        nx = (nx+COLS)%COLS; ny = (ny+ROWS)%ROWS;
      }
      if (stones.some(s=>s.x===nx && s.y===ny)) continue;
      const willEat = foods.some(f=>f.x===nx && f.y===ny);
      const limit = willEat ? snake.length : snake.length-1;
      let hitSelf = false;
      for (let i=0;i<limit;i++) if (snake[i].x===nx && snake[i].y===ny) { hitSelf=true; break; }
      if (hitSelf) continue;

      const dist = manhattan({x:nx,y:ny}, target);
      const space = floodFill({x:nx,y:ny}, 120);
      const s = -dist*3 + space*1.2 + Math.random()*0.3;
      if (s > bestScore) { bestScore = s; bestDir = d.name; }
    }
    if (bestDir) nextDir = DIR[bestDir];
  }
  function manhattan(a,b){ return Math.abs(a.x-b.x)+Math.abs(a.y-b.y); }
  function bfsDist(start, goal) {
    if (start.x===goal.x && start.y===goal.y) return 0;
    const q = [{x:start.x,y:start.y,d:0}], seen = new Set([start.x+','+start.y]);
    while (q.length) {
      const cur = q.shift();
      for (const k of DIR_LIST) {
        const d = DIR[k];
        let nx = cur.x+d.x, ny = cur.y+d.y;
        if (nx<0||nx>=COLS||ny<0||ny>=ROWS) { if (wallMode) continue; nx=(nx+COLS)%COLS; ny=(ny+ROWS)%ROWS; }
        if (seen.has(nx+','+ny)) continue;
        if (stones.some(s=>s.x===nx && s.y===ny)) continue;
        if (nx===goal.x && ny===goal.y) return cur.d+1;
        seen.add(nx+','+ny); q.push({x:nx,y:ny,d:cur.d+1});
      }
    }
    return -1;
  }
  function floodFill(start, limit) {
    const occ = new Set();
    snake.forEach(p=>occ.add(p.x+','+p.y));
    stones.forEach(p=>occ.add(p.x+','+p.y));
    const q = [start], seen = new Set([start.x+','+start.y]);
    let count = 0;
    while (q.length && count < limit) {
      const cur = q.shift(); count++;
      for (const k of DIR_LIST) {
        const d = DIR[k];
        let nx = cur.x+d.x, ny = cur.y+d.y;
        if (nx<0||nx>=COLS||ny<0||ny>=ROWS) { if (wallMode) continue; nx=(nx+COLS)%COLS; ny=(ny+ROWS)%ROWS; }
        const key = nx+','+ny;
        if (seen.has(key) || occ.has(key)) continue;
        seen.add(key); q.push({x:nx,y:ny});
      }
    }
    return count;
  }

  /* ============ 绘制 ============ */
  function drawGrid() {
    ctx.fillStyle = COLOR.bg; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = COLOR.grid; ctx.lineWidth = 1; ctx.beginPath();
    for (let x=1;x<COLS;x++){ ctx.moveTo(x*CELL+.5,0); ctx.lineTo(x*CELL+.5,H); }
    for (let y=1;y<ROWS;y++){ ctx.moveTo(0,y*CELL+.5); ctx.lineTo(W,y*CELL+.5); }
    ctx.stroke();
    if (wallMode) {
      ctx.strokeStyle = 'rgba(255,93,115,.35)'; ctx.lineWidth = 2;
      ctx.strokeRect(1,1,W-2,H-2);
    }
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawStones() {
    for (const s of stones) {
      const x = s.x*CELL+1.5, y = s.y*CELL+1.5, size = CELL-3;
      ctx.fillStyle = COLOR.stone; roundRect(x,y,size,size,4); ctx.fill();
      ctx.fillStyle = COLOR.stoneHi; roundRect(x+2,y+2,size-4,(size-4)*0.35,3); ctx.fill();
    }
  }
  function drawFoods(t) {
    for (const f of foods) {
      const def = FOOD_TYPES[f.type];
      const cx = f.x*CELL+CELL/2, cy = f.y*CELL+CELL/2;
      const pulse = 1 + Math.sin(t/200 + f.x + f.y)*0.14;
      const r = (CELL/2-2.5)*pulse;
      ctx.save();
      ctx.shadowColor = def.glow; ctx.shadowBlur = 15;
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.restore();
      if (f.type !== 'normal') {
        ctx.fillStyle = 'rgba(0,0,0,.65)';
        ctx.font = `bold ${CELL*0.5}px Arial`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(def.label[0], cx, cy+0.5);
      }
    }
  }
  function drawSnake() {
    const n = snake.length;
    for (let i=n-1;i>=0;i--) {
      const s = snake[i], p = i/Math.max(1,n-1);
      if (i === 0) {
        const x = s.x*CELL+1.2, y = s.y*CELL+1.2, size = CELL-2.4;
        ctx.save(); ctx.shadowColor = COLOR.headGlow; ctx.shadowBlur = 16;
        ctx.fillStyle = COLOR.head; roundRect(x,y,size,size,6); ctx.fill(); ctx.restore();
        const perp = {x:-dir.y, y:dir.x}, off = CELL*0.24;
        const bx = s.x*CELL+CELL/2+dir.x*CELL*0.24;
        const by = s.y*CELL+CELL/2+dir.y*CELL*0.24;
        for (const sgn of [1,-1]) {
          ctx.fillStyle = '#08130d';
          ctx.beginPath();
          ctx.arc(bx+perp.x*off*sgn, by+perp.y*off*sgn, 2.2, 0, Math.PI*2);
          ctx.fill();
        }
        if (aiMode) {
          ctx.fillStyle = 'rgba(192,139,255,.9)';
          ctx.font = 'bold 9px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('AI', s.x*CELL+CELL/2, s.y*CELL-4);
        }
      } else {
        const pad = 1.2 + p*1.1;
        ctx.fillStyle = i%2===0 ? COLOR.body : COLOR.bodyAlt;
        ctx.globalAlpha = 1 - p*0.25;
        roundRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 5);
        ctx.fill(); ctx.globalAlpha = 1;
      }
    }
  }
  function drawParticles() {
    for (const p of particles) {
      const a = Math.max(0, p.life/p.max);
      ctx.globalAlpha = a; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawFloats() {
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for (const f of floats) {
      const a = Math.max(0, f.life/f.max);
      ctx.globalAlpha = a; ctx.fillStyle = f.color;
      ctx.font = 'bold 13px Arial';
      ctx.shadowColor = f.color; ctx.shadowBlur = 8;
      ctx.fillText(f.text, f.x, f.y); ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }
  function render(t) {
    drawGrid(); drawStones(); drawFoods(t); drawSnake(); drawParticles(); drawFloats();
  }

  /* ============ 主循环 ============ */
  let prev = performance.now();
  function loop(now) {
    const dt = Math.min((now-prev)/1000, 0.1);
    prev = now;
    update(dt); render(now);
    requestAnimationFrame(loop);
  }

  /* ============ 控件绑定 ============ */
  diffSeg.addEventListener('click', e => {
    const btn = e.target.closest('button[data-diff]'); if (!btn) return;
    difficulty = btn.dataset.diff;
    [...diffSeg.children].forEach(b => b.classList.toggle('active', b===btn));
    start();
  });

  function setSpeedMult(m) {
    speedMult = m;
    multEl.textContent = m + '×';
    [...speedSeg.children].forEach(b => b.classList.toggle('active', Number(b.dataset.mult)===m));
    Sound.speedChange(m);
  }
  speedSeg.addEventListener('click', e => {
    const btn = e.target.closest('button[data-mult]'); if (!btn) return;
    setSpeedMult(Number(btn.dataset.mult));
  });

  function toggleWall() { wallMode = !wallMode; wallToggle.classList.toggle('on', wallMode); start(); }
  wallToggle.addEventListener('click', toggleWall);

  function toggleSound() {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on); soundToggle.classList.toggle('on', on);
    if (on) Sound.eat();
  }
  soundToggle.addEventListener('click', toggleSound);

  function toggleAI() {
    aiMode = !aiMode; aiToggle.classList.toggle('on', aiMode);
    if (aiMode && state === STATE.PAUSED) resume();
    if (aiMode && state === STATE.READY) start();
  }
  aiToggle.addEventListener('click', toggleAI);

  /* ============ 启动 ============ */
  reset();
  state = STATE.READY;
  stateEl.textContent = '准备中';
  multEl.textContent = speedMult + '×';
  showOverlay('准备开始',
    `难度：<b>${DIFF[difficulty].name}</b> &nbsp;·&nbsp; ${wallMode ? '有障碍' : '无障碍'}<br>
     <kbd>方向键</kbd>/<kbd>WASD</kbd> 控制 · <kbd>空格</kbd> 暂停 · <kbd>R</kbd> 重开<br>
     <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd><kbd>5</kbd> 对应 1×/2×/3×/5×/10× 倍速 · <kbd>I</kbd> AI 托管`,
    '开始游戏');

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
